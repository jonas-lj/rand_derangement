[package]
name = "rand_combinatorics"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Uniform random sampling of combinatorial structures: permutations, derangements, and set partitions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonas-lj/rand_combinatorics"
keywords = ["combinatorics", "permutation", "partition", "random", "sampling"]
categories = ["algorithms", "mathematics"]

[dependencies]
rand = "0.10.2"

[[bench]]
name = "sampling"
harness = false

[dev-dependencies]
criterion = "0.8.2"
